[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
dynamic = ["version"]
description = "OpenAI-compatible LLM gateway: semantic caching, model routing, cross-provider failover, per-key rate limits and cost accounting in front of NVIDIA NIM, Ollama or any OpenAI-style upstream."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Brito" }]
requires-python = ">=3.11"
keywords = ["llm", "gateway", "openai", "nvidia-nim", "ollama", "semantic-cache", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage>=7.4",
    "openai>=1.30",
]

[project.scripts]
llm-gateway = "app.cli:main"

[project.urls]
Repository = "https://github.com/AleBrito124356/llm-gateway"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
